name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name LMU_Dashboard --add-data "vendor;vendor" main.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMU_Dashboard-windows-exe
          path: dist/LMU_Dashboard.exe
